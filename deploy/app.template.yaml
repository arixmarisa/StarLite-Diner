# Replace YOUR_REGISTRY once before creating the app. Do not commit credentials.
name: starlite-diner
region: nyc
services:
  - name: diner
    image:
      registry_type: DOCR
      registry: YOUR_REGISTRY
      repository: starlite-diner
      tag: prod
      deploy_on_push:
        enabled: true
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /api/v1/ready
    envs:
      - key: NODE_ENV
        scope: RUN_TIME
        value: production
      - key: HOST
        scope: RUN_TIME
        value: 0.0.0.0
      - key: PORT
        scope: RUN_TIME
        value: '8080'
      - key: LOG_LEVEL
        scope: RUN_TIME
        value: info
ingress:
  rules:
    - match:
        path:
          prefix: /
      component:
        name: diner
