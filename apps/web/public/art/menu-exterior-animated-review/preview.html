<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Starlite Diner · Exterior animation preview</title>
    <style>
      :root {
        color-scheme: dark;
        background: #1d2941;
      }
      body {
        margin: 0;
        overflow: hidden;
      }
      #stage {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 384px;
        height: 216px;
        transform: translate(-50%, -50%) scale(var(--scale, 1));
        transform-origin: center;
        image-rendering: pixelated;
      }
      canvas {
        display: block;
        width: 384px;
        height: 216px;
        image-rendering: pixelated;
      }
      button {
        position: absolute;
        left: 144px;
        top: 148px;
        width: 96px;
        height: 28px;
        padding: 0;
        border: 0;
        background: transparent;
        cursor: pointer;
      }
      button img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
      }
      .highlight,
      .pressed {
        visibility: hidden;
      }
      button:hover:not(:disabled) .highlight,
      button:focus-visible .highlight {
        visibility: visible;
      }
      button:active:not(:disabled) .pressed {
        visibility: visible;
      }
      button:focus-visible {
        outline: none;
      }
      button:disabled {
        cursor: default;
      }
      #status {
        position: fixed;
        bottom: 12px;
        width: 100%;
        text-align: center;
        font: 14px sans-serif;
      }
    </style>
  </head>
  <body>
    <main id="stage">
      <canvas
        width="384"
        height="216"
        aria-label="Starlite Diner exterior with animated neon and entrance doors"
      ></canvas>
      <button id="start" type="button" aria-label="Preview door opening" disabled>
        <img src="/art/menu-v1/start-rest.png" alt="Start" />
        <img class="highlight" src="/art/menu-v1/start-highlight.png" alt="" />
        <img class="pressed" src="/art/menu-v1/start-pressed.png" alt="" />
      </button>
    </main>
    <p id="status" role="status">Loading preview…</p>
    <script type="module" src="./preview.mjs"></script>
  </body>
</html>
